<title>Unlock Celebration Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<!--
  PROTOTYPE — throwaway. Answers "Unlock celebration" (map: Player identity, #52 / ticket #61).
  Three variants of how a player learns they earned a badge, title or trophy item, each shown across four scenes:
  the event finishing (several unlocks), the one-time launch welcome, the persistent hint, and a single trophy item with "Wear it".
  Switch variants with the bottom bar, ← →, or #sheet / #stamp / #inline. Scenes are the tabs above the phone.
-->
<style>
  :root {
    --ink: #0d0e12; --surface: #15161b; --surface-raised: #1e1f25; --line: #2c2d35;
    --paper: #f4efe8; --paper-dim: #b3ada5; --orange: #f06a2a; --on-orange: #1a120c; --gold: #e2b33c; --win: #3fa66b;
    --font: 'Archivo', 'Arial Narrow', system-ui, sans-serif; color-scheme: dark;
    --expo: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  body { background: var(--ink); color: var(--paper); font-family: var(--font); font-size: 15px; line-height: 1.4; margin: 0; }
  button { font: inherit; color: inherit; }
  .page { max-width: 1040px; margin: 0 auto; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
  .display { font-stretch: 125%; font-weight: 850; letter-spacing: -0.01em; }
  .num { font-stretch: 72%; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dim { color: var(--paper-dim); }
  .intro h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); }
  .intro p { color: var(--paper-dim); max-width: 66ch; margin: 6px 0 0; }
  .layout { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .scenes { display: flex; gap: 6px; flex-wrap: wrap; }
  .scenes button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .scenes button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--paper-dim); }
  .tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .linkbtn { background: none; border: 0; color: var(--orange); cursor: pointer; padding: 0; font-weight: 700; }

  /* phone */
  .phone { position: relative; width: 100%; max-width: 390px; height: 720px; border: 1px solid var(--line); border-radius: 28px; overflow: hidden; background: var(--ink); isolation: isolate; }
  .app { position: absolute; inset: 0; overflow-y: auto; padding-bottom: 72px; }
  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--ink); z-index: 2; }
  .wordmark { font-size: 18px; }
  .wordmark b { color: var(--orange); }
  .me-btn { position: relative; border: 0; background: none; padding: 0; cursor: pointer; display: inline-grid; }
  .dot { position: absolute; top: -1px; right: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--orange); border: 2px solid var(--ink); }
  .content { padding: 16px; display: grid; gap: 16px; }
  .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px; }
  .label { font-size: 12px; font-weight: 700; color: var(--paper-dim); margin: 0; }
  .btn { border: 1px solid var(--line); background: var(--surface-raised); border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; position: relative; transition: transform .12s; min-height: 44px; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--orange); color: var(--on-orange); border-color: var(--orange); }
  .btn.ghost { background: none; }
  .btn .dot { top: -4px; right: -4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .stand-row { display: grid; grid-template-columns: 28px 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stand-row:last-child { border-bottom: 0; }
  .stand-row.me { background: var(--surface-raised); margin: 0 -14px; padding: 8px 14px; }
  .stand-row .r { font-size: 20px; color: var(--paper-dim); }
  .stand-row.me .r { color: var(--orange); }
  .chip { display: inline-flex; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--ink); z-index: 3; }
  .tabbar button { background: none; border: 0; padding: 10px 0 14px; font-size: 11px; font-weight: 700; color: var(--paper-dim); position: relative; cursor: pointer; }
  .tabbar button.on { color: var(--paper); }
  .tabbar .dot { top: 6px; right: calc(50% - 22px); }
  .new-tag { font-size: 10px; font-weight: 800; color: var(--on-orange); background: var(--orange); border-radius: 4px; padding: 1px 5px; letter-spacing: .04em; }
  .item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .item b { display: block; }
  .item small { color: var(--paper-dim); font-size: 12px; }
  .badge-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
  .badge-strip figure { margin: 0; display: grid; justify-items: center; gap: 4px; width: 68px; flex: none; font-size: 11px; color: var(--paper-dim); text-align: center; }

  /* A: bottom sheet */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 5; animation: fade .2s ease-out; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 10px 16px 18px; display: grid; gap: 14px; max-height: 88%; overflow-y: auto; animation: rise .42s var(--expo); }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
  .sheet h2 { margin: 0; font-size: 24px; }
  .sheet-list { display: grid; gap: 10px; }
  .sheet-list > div { border-top: 1px solid var(--line); padding-top: 10px; }
  .wear { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 12px; align-items: center; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }

  /* B: full-screen stamp */
  .stage { position: absolute; inset: 0; z-index: 6; background: var(--ink); display: grid; grid-template-rows: auto 1fr auto; padding: 18px 16px 22px; cursor: pointer; animation: fade .18s ease-out; }
  .stage .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--paper-dim); }
  .stage .center { display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; }
  .stamp-slab { position: relative; display: grid; place-items: center; padding: 22px 34px; }
  .stamp-slab::before { content: ''; position: absolute; inset: 0; background: var(--orange); transform: skewX(-12deg); border-radius: 8px; animation: wipe .72s var(--expo) both; }
  .stamp-slab > * { position: relative; }
  .stamp-in { animation: stamp .5s .32s var(--expo) both; }
  .stage h2 { margin: 0; font-size: 30px; line-height: 1.05; }
  .pips { display: flex; gap: 6px; justify-content: center; }
  .pips i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
  .pips i.on { background: var(--paper); }
  .count { font-size: 120px; line-height: .8; color: var(--orange); }

  /* C: inline */
  .earned { border: 1px solid var(--orange); border-radius: 14px; background: var(--surface); padding: 14px; display: grid; gap: 12px; animation: grow .42s var(--expo); }
  .earned-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .earned .badge-strip figure { animation: pop .36s var(--expo) both; }
  .banner-card { border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 12px; background: var(--surface); padding: 12px 14px; display: grid; gap: 8px; }

  @keyframes fade { from { opacity: 0 } }
  @keyframes rise { from { transform: translateY(100%) } }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
  @keyframes stamp { from { transform: scale(1.35); opacity: 0 } }
  @keyframes pop { from { transform: translateY(8px); opacity: 0 } }
  @keyframes grow { from { opacity: 0; transform: translateY(-6px) } }
  .reduce *, .reduce *::before { animation-name: fade !important; animation-duration: .2s !important; transform: none !important; }
  .reduce .stamp-slab::before { transform: skewX(-12deg) !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation-name: fade !important; animation-duration: .2s !important; }
  }

  .notes { display: grid; gap: 14px; }
  .notes h2 { margin: 0; font-size: 22px; }
  .notes p { margin: 0; color: var(--paper-dim); max-width: 60ch; }
  .notes ul { margin: 0; padding-left: 18px; color: var(--paper-dim); display: grid; gap: 6px; max-width: 60ch; }
  .notes b { color: var(--paper); }
  .log { font-family: ui-monospace, monospace; font-size: 12px; color: var(--paper-dim); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }

  .switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 4px; background: #fff; color: #111; border-radius: 999px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 20; font-family: system-ui, sans-serif; font-size: 13px; max-width: calc(100vw - 32px); }
  .switcher button { border: 0; background: #eee; border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; color: #111; }
  .switcher .lbl { padding: 0 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>

<main class="page">
  <header class="intro">
    <h1 class="display">Unlock celebration</h1>
    <p>Three ways a player finds out they earned a badge, title or trophy item. Each variant runs through the same four scenes. Tap inside the phone: dismiss, "Wear it" and the hint all work. Switch variants with the bar at the bottom.</p>
  </header>
  <div class="scenes" id="scenes" role="group" aria-label="Scene"></div>
  <div class="layout">
    <div style="display:grid;gap:10px">
      <div class="phone" id="phone"></div>
      <div class="tools"><button class="linkbtn" id="replay">Replay scene</button><label><input type="checkbox" id="rm"> Reduced motion</label></div>
    </div>
    <section class="notes" id="notes"></section>
  </div>
</main>
<div class="switcher" role="toolbar" aria-label="Prototype variant"><button id="prev" aria-label="Previous variant">←</button><span class="lbl" id="vlabel"></span><button id="next" aria-label="Next variant">→</button></div>

<script>
const SKIN = ['#F7DCC8', '#EBBF9C', '#D49C70', '#AE7449', '#7D4B2C', '#4F2F1D']
const HAIR = ['#17181B', '#4A2E1E', '#8A5A2B', '#D9A441', '#CFC8BE', '#B5452F', '#3E5DA8']
const CLOTH = ['#EDE8E0', '#2B2E36', '#3F6FB6', '#C23B3B', '#2F8F5B', '#E2B33C', '#7A4FB0', '#2C8C99']
const INK = '#14151a'
const GOLD = '#E2B33C'

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16)
  const f = (c) => Math.max(0, Math.min(255, Math.round(c + (amt < 0 ? c * amt : (255 - c) * amt))))
  const r = f(n >> 16), g = f((n >> 8) & 255), b = f(n & 255)
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)
}
// ---------- parts ----------
// Each part returns { back, front } SVG strings. `s(d, fill)` draws a filled shape (outlined in the sticker direction).
// Hair is a full volume around the skull (not painted on): crown ~16 units above the head, sides past the temples.
const VOL = 'M48 102C42 50 68 32 100 32C132 32 158 50 152 102C148 86 142 76 132 70C118 75 82 75 68 70C58 76 52 86 48 102Z'
const HAIRS = {
  bald: { name: 'Bald', draw: () => ({}) },
  short: { name: 'Short', draw: (c, s) => ({ front: s(VOL, c) }) },
  spiky: { name: 'Spiky', draw: (c, s) => ({ front: s('M50 70L56 34L72 44L76 18L92 36L100 12L110 36L126 18L130 44L146 34L150 70Z', c) + s(VOL, c) }) },
  long: { name: 'Long', draw: (c, s) => ({ back: s('M46 100C40 46 68 30 100 30C132 30 160 46 154 100L160 168L40 168Z', shade(c, -0.18)), front: s('M48 104C42 50 68 32 100 32C132 32 158 50 152 104C146 84 132 70 112 64C100 74 76 76 60 74C54 82 50 92 48 104Z', c) }) },
  curly: { name: 'Curly', draw: (c, s) => ({ front: [[50, 92], [52, 70], [64, 50], [82, 36], [100, 32], [118, 36], [136, 50], [148, 70], [150, 92]].map(([x, y]) => s(`M${x - 17} ${y}a17 17 0 1 0 34 0a17 17 0 1 0 -34 0Z`, c)).join('') + s(VOL, c) }) },
  ponytail: { name: 'Ponytail', draw: (c, s) => ({ back: s('M140 64C172 70 176 124 156 156C152 128 148 104 132 86Z', shade(c, -0.12)), front: s(VOL, c) }) },
  buzz: { name: 'Buzz', draw: (c, s) => ({ front: s('M52 96C48 54 72 40 100 40C128 40 152 54 148 96C142 80 126 70 100 70C74 70 58 80 52 96Z', shade(c, 0.12)) }) },
}

const TOPS = {
  tee: { name: 'Tee', draw: (c, s, skin) => ({ body: s(BODY, c) + s('M86 146Q100 164 114 146Z', skin) }) },
  hoodie: { name: 'Hoodie', draw: (c, s) => ({ behind: s('M58 166C56 128 76 120 100 120C124 120 144 128 142 166Z', shade(c, -0.25)), body: s(BODY, c) + `<path d="M93 156V182M107 156V182" stroke="${shade(c, 0.6)}" stroke-width="3" stroke-linecap="round"/>` }) },
  jacket: { name: 'Track jacket', draw: (c, s) => ({ body: s(BODY, c) + s('M86 148L100 196L114 148Z', CLOTH[0]) + s('M86 148L100 196L76 160Z', shade(c, -0.2)) + s('M114 148L100 196L124 160Z', shade(c, -0.2)) + `<path d="M40 178L60 162M160 178L140 162" stroke="${CLOTH[0]}" stroke-width="4"/>` }) },
  jersey: { name: 'Jersey', draw: (c, s) => ({ body: s(BODY, c) + `<rect x="30" y="172" width="140" height="10" fill="${shade(c, 0.55)}"/>` + s('M86 146Q100 162 114 146Z', shade(c, -0.25)) }) },
  topcut: { name: 'Top-cut jacket', trophy: 'Make a top cut', draw: (c, s) => ({ body: s(BODY, CLOTH[1]) + s('M86 148L100 196L114 148Z', GOLD) + `<path d="M38 182L62 160M162 182L138 160" stroke="${GOLD}" stroke-width="6"/>` }) },
}
const BODY = 'M30 212C30 168 60 148 100 148C140 148 170 168 170 212Z'

// Crowns are wider and taller than any hair volume, so hair never pokes through the top; `covers` hats clip hair above the brim.
const CROWN = 'M48 90C48 40 72 22 100 22C128 22 152 40 152 90Z'
const PANEL = 'M76 90C76 48 86 28 100 28C114 28 124 48 124 90Z'
const BRIM = 'M40 90Q100 77 160 90Q164 102 100 100Q36 102 40 90Z'
const VBRIM = 'M40 84Q100 71 160 84Q164 96 100 94Q36 96 40 84Z'
const HATS = {
  none: { name: 'None', draw: () => '' },
  trainer: { name: 'Trainer cap', covers: true, draw: (c, c2, s) => s(CROWN, c) + s(PANEL, c2) + s('M91 66L100 56L109 66L104.5 66L100 61L95.5 66Z', c) + s(BRIM, shade(c, -0.25)) },
  backwards: { name: 'Backwards cap', covers: true, draw: (c, c2, s) => s(CROWN, c) + s('M78 76H122V88H78Z', shade(c, -0.3)) + `<circle cx="89" cy="82" r="2.2" fill="${c2}"/><circle cx="100" cy="82" r="2.2" fill="${c2}"/><circle cx="111" cy="82" r="2.2" fill="${c2}"/>` },
  beanie: { name: 'Beanie', covers: true, draw: (c, c2, s) => s('M100 8a13 13 0 1 0 0.1 0Z', c2) + s('M50 84C50 36 74 22 100 22C126 22 150 36 150 84Z', c) + s('M44 72H156V94H44Z', shade(c, -0.2)) },
  visor: { name: 'Visor', draw: (c, c2, s) => s('M48 70H152V84H48Z', c) + s(VBRIM, c2) },
  bucket: { name: 'Bucket hat', covers: true, draw: (c, c2, s) => s('M54 82C54 34 78 22 100 22C122 22 146 34 146 82Z', c) + s('M54 70H146V82H54Z', c2) + s('M28 98L54 78H146L172 98Q100 108 28 98Z', shade(c, -0.2)) },
  headband: { name: 'Headband', draw: (c, c2, s) => s('M48 68H152V82H48Z', c) + s('M150 70L172 60L170 82Z', c2) },
  champion: { name: 'Champion cap', trophy: 'Win an event', covers: true, draw: (c, c2, s) => s(CROWN, c) + s(PANEL, GOLD) + s('M100 44L104.5 55L116 55L107 62L110.5 74L100 67L89.5 74L93 62L84 55L95.5 55Z', c) + s(BRIM, GOLD) },
  cupvisor: { name: 'Cup visor', trophy: 'Top 8 at a League Cup', draw: (c, c2, s) => s('M48 70H152V84H48Z', c) + s(VBRIM, GOLD) },
}

const ACCS = {
  none: { name: 'None', draw: () => ({}) },
  glasses: { name: 'Glasses', draw: () => ({ face: `<g fill="none" stroke="${INK}" stroke-width="3.5"><rect x="72" y="88" width="22" height="16" rx="5"/><rect x="106" y="88" width="22" height="16" rx="5"/><path d="M94 95H106"/></g>` }) },
  plaster: { name: 'Plaster', draw: (s) => ({ face: s('M114 112l14-6l3 6l-14 6Z', CLOTH[0]) }) },
  straps: { name: 'Backpack', draw: (s) => ({ over: s('M58 156L70 152L76 212L62 212Z', '#5b4634') + s('M142 156L130 152L124 212L138 212Z', '#5b4634') }) },
  pin: { name: 'League pin', trophy: 'Play 10 events', draw: (s) => ({ over: s('M128 170a8 8 0 1 0 0.1 0Z', GOLD) }) },
}

function avatarSVG(cfg, variant, size) {
  const id = 'a' + (uid++)
  const outline = variant === 'sticker'
  const angular = variant === 'tile'
  const s = (d, fill) => `<path d="${d}" fill="${fill}"${outline ? ` stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"` : ''}/>`
  const skin = SKIN[cfg.skin]
  const hairC = HAIR[cfg.hairColour]
  const hair = HAIRS[cfg.hair].draw(hairC, s)
  const top = TOPS[cfg.top].draw(CLOTH[cfg.topColour], s, skin)
  const acc = ACCS[cfg.accessory].draw(s)
  const hat = HATS[cfg.hat].draw(CLOTH[cfg.hatColour], CLOTH[cfg.hatColour2], s)
  const head = angular
    ? s('M70 54L130 54L146 76L146 112L126 134L74 134L54 112L54 76Z', skin)
    : s('M56 94a44 44 0 1 0 88 0a44 44 0 1 0 -88 0Z', skin)
  const ears = s('M48 98a8 8 0 1 0 16 0a8 8 0 1 0 -16 0Z', shade(skin, -0.08)) + s('M136 98a8 8 0 1 0 16 0a8 8 0 1 0 -16 0Z', shade(skin, -0.08))
  const eyes = angular
    ? `<rect x="80" y="92" width="8" height="9" fill="${INK}"/><rect x="112" y="92" width="8" height="9" fill="${INK}"/>`
    : `<circle cx="84" cy="97" r="4.5" fill="${INK}"/><circle cx="116" cy="97" r="4.5" fill="${INK}"/>`
  const mouth = `<path d="M90 112Q100 120 110 112" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`
  const neck = s('M88 120H112V152H88Z', shade(skin, -0.12))

  const hc = HATS[cfg.hat].covers
  const hairClip = hc ? `<clipPath id="${id}h"><rect x="0" y="56" width="200" height="200"/></clipPath>` : ''
  const wrapHair = (x) => x && hc ? `<g clip-path="url(#${id}h)">${x}</g>` : x
  hair.back = wrapHair(hair.back); hair.front = wrapHair(hair.front)
  const art = [hair.back, top.behind, neck, top.body, acc.over, ears, head, eyes, mouth, acc.face, hair.front, hat && `<g transform="translate(0 -9)">${hat}</g>`].filter(Boolean).join('')

  let frame, viewBox, clip
  if (variant === 'tile') {
    viewBox = '30 18 140 140'
    clip = `<clipPath id="${id}"><path d="M52 18H170L148 158H30Z"/></clipPath>`
    frame = `<path d="M52 18H170L148 158H30Z" fill="${CLOTH[cfg.sleeve]}"/><path d="M52 18H170L148 158H30Z" fill="${INK}" opacity=".35"/>`
  } else {
    viewBox = '0 0 200 200'
    clip = `<clipPath id="${id}"><circle cx="100" cy="100" r="${outline ? 94 : 100}"/></clipPath>`
    frame = `<circle cx="100" cy="100" r="100" fill="${outline ? '#f4efe8' : '#24252c'}"/>` + (outline ? `<circle cx="100" cy="100" r="94" fill="#24252c"/>` : '')
  }
  return `<svg class="avatar-in" width="${size}" height="${size}" viewBox="${viewBox}" role="img" aria-label="Avatar">${clip}${hairClip}${frame}<g clip-path="url(#${id})">${art}</g></svg>`
}

let uid = 0
// ---------- achievements (from "Achievement catalogue") ----------
const SHAPES = {
  circle: 'M50 6a44 44 0 1 0 0.1 0Z',
  hex: 'M50 4L90 27V73L50 96L10 73V27Z',
  shield: 'M50 4L90 16V50C90 74 72 90 50 98C28 90 10 74 10 50V16Z',
  diamond: 'M50 2L98 50L50 98L2 50Z',
  square: 'M14 8H86Q92 8 92 14V86Q92 92 86 92H14Q8 92 8 86V14Q8 8 14 8Z',
}
const ACH = {
  regular: { name: 'Regular', unit: 'events played', tiers: [1, 5, 10, 25, 50, 100], shape: 'circle' },
  winner: { name: 'Match winner', unit: 'match wins', tiers: [1, 10, 50, 100, 250, 500], shape: 'hex' },
  champion: { name: 'Champion', unit: 'events won', tiers: [1, 5, 10, 25], shape: 'shield' },
  topcut: { name: 'Top cut', unit: 'top cuts', tiers: [1, 5, 10, 25], shape: 'diamond' },
  host: { name: 'Host', unit: 'events hosted', tiers: [1, 10, 25, 50], shape: 'square' },
  sweep: { name: 'Clean sweep', unit: 'clean sweeps', tiers: [5, 25, 100], shape: 'hex' },

function wear(id) {
  const it = ITEMS[id]

    if (it.slot === 'banner') state.banner = 'card-zones'; else state.avatar[it.slot] = BASE[it.slot]

  } else {

    state.wearing.push(id)
    if (it.slot === 'banner') state.banner = 'slab'; else state.avatar[it.slot] = it.value
    log(`wear: ${it.name} (saved at once, no Save step)`)

}

// ---------- variant B: stamp ----------
function stampSteps() {
  const s = S()
  if (scene === 'launch') return [{ kind: 'count' }, { kind: 'items' }]
  const steps = []
  const used = new Set()
  for (const id of s.items) steps.push({ kind: 'item', id })
  // a badge that brought a title gets the title on its own screen
  for (const u of s.badges) steps.push({ kind: 'badge', u, title: u.ach === 'champion' && s.titles.includes('Champion') ? 'Champion' : u.ach === 'regular' && s.titles.includes('Regular') ? 'Regular' : null })
  return steps.filter((x) => !(x.kind === 'item' && used.has(x.id)))
}
function stampBody() {

  if (st.kind === 'items') center = `<h2 class="display">Your trophy items</h2><div style="display:grid;gap:8px;width:100%;text-align:left">${s.items.map((i) => itemRow(i, 48)).join('')}</div>`

  if (st.kind === 'badge') center = `<p class="label">Badge</p><div class="stamp-slab"><span class="stamp-in">${badge(st.u.ach, st.u.tier, 140)}</span></div><h2 class="display">${badgeName(st.u)}</h2><p class="dim" style="margin:0">${ACH[st.u.ach].secret ? 'Secret achievement' : `${st.u.tier} ${ACH[st.u.ach].unit}`}</p>${st.title ? titleRow(st.title) : ''}`

// ---------- page assembly ----------
function render() {
  const v = VARIANTS[variant], s = S()
  const pendingHint = !state.open && !state.seen
  let page = '', overlay = '', profileMark = '', headerDot = false, customiseDot = false
  if (variant === 'sheet') { headerDot = pendingHint; customiseDot = pendingHint; profileMark = pendingHint ? '<span class="dot"></span>' : '' }
  if (variant === 'stamp') profileMark = pendingHint ? `<span class="new-tag" style="position:absolute;top:4px;right:calc(50% - 30px)">${newCount()}</span>` : ''

  const view = state.view
  if (view === 'start') {
    if (scene === 'event' || scene === 'trophy') page = eventPage(variant === 'inline' ? inlineCard(false) : '')
    else if (scene === 'launch') page = eventsHome(variant === 'inline' ? inlineCard(false) : '')
    else page = eventsHome(variant === 'inline' && !state.seen ? inlineCard(true) : '')
  } else if (view === 'profile') page = profilePage(customiseDot)
  else if (view === 'ach') page = achPage()
  else if (view === 'customise') page = customisePage()
  else page = `<div class="content"><h1 class="display" style="margin:0;font-size:24px">Decks</h1><p class="dim">…</p></div>`

  if (state.open && view === 'start' && variant === 'sheet') overlay = sheetBody()
  if (state.open && view === 'start' && variant === 'stamp') overlay = stampBody()

  document.getElementById('phone').innerHTML = `<div class="app">${header(headerDot)}${page}</div>${tabbar(view === 'ach' || view === 'customise' ? 'profile' : view, profileMark)}${overlay}`
  document.getElementById('phone').classList.toggle('reduce', document.getElementById('rm').checked)

  document.getElementById('scenes').innerHTML = SCENE_KEYS.map((k) => `<button aria-pressed="${k === scene}" data-scene="${k}">${SCENES[k].tab}</button>`).join('')
  document.getElementById('vlabel').textContent = `${v.key} (${v.name})`
  const st = { scene, overlayOpen: state.open, newSinceMarker: newCount(), hintShowing: pendingHint && variant !== 'inline', titleShown: state.title, wearing: state.wearing.map((i) => ITEMS[i].name), view }
  document.getElementById('notes').innerHTML = `
    <div><p class="label">${v.key} · ${v.name}</p><h2 class="display">${s.tab}</h2><p style="margin-top:6px">${s.ask}</p></div>
    <p>${v.summary}</p><p>${v.hint}</p><p>${v.absent}</p>
    <ul>${v.pros.map((p) => `<li><b>+</b> ${p}</li>`).join('')}${v.cons.map((p) => `<li><b>−</b> ${p}</li>`).join('')}</ul>
    <div class="log">${JSON.stringify(st, null, 1).replace(/[{}"]/g, '').trim()}\n\n${state.log.join('\n')}</div>`
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-scene],[data-go],[data-wear],[data-title],[data-dismiss],[data-next]')
  if (!el) return
  const d = el.dataset
  if (d.scene) { scene = d.scene; reset(); return render() }
  if (d.wear) { e.stopPropagation(); return wear(d.wear) }
  if (d.title) { e.stopPropagation(); return showTitle(d.title) }
  if (d.dismiss) { e.stopPropagation(); return dismiss(d.dismiss) }
  if (d.go) { if (d.go === 'ach') state.newSnapshot = !state.seen; return go(d.go) }
  if (d.next) {
    const n = stampSteps().length
    if (state.step < n - 1) { state.step++; log(`next → ${state.step + 1}/${n}`); render() } else dismiss('tap after last')
  }
})
function setVariant(k) { variant = k; history.replaceState(null, '', '#' + k); reset(); render() }
const cycle = (d) => setVariant(ORDER[(ORDER.indexOf(variant) + d + ORDER.length) % ORDER.length])
document.getElementById('prev').onclick = () => cycle(-1)
document.getElementById('next').onclick = () => cycle(1)
document.getElementById('replay').onclick = () => { reset(); render() }
document.getElementById('rm').onchange = () => { reset(); render() }
addEventListener('keydown', (e) => { if (e.target.matches('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1) })
addEventListener('hashchange', () => { const k = location.hash.slice(1); if (ORDER.includes(k) && k !== variant) setVariant(k) })
reset(); render()
</script>
